<body>
  <div class="grid">
    <my-header></my-header>

    <main>
      <section id="sezione-squadra">
        <a class="torna-squadre" href="/squadre.html">
          <i class="icona icona-arrow-left" aria-hidden="true"></i> Tutte le squadre
        </a>

        <div class="intestazione-squadra">
          <img id="logo-squadra" class="logo-squadra" alt="" width="120" height="120" hidden />
          <div>
            <h1 id="nome-squadra" class="section-title">
              <span class="skeleton skeleton-text" style="display:inline-block; width: 180px; height: 2rem;"></span>
            </h1>
            <p id="dettagli-squadra" class="dettagli-squadra"></p>
          </div>
        </div>

        <div id="azioni-squadra" class="azioni-squadra">
          <button type="button" id="pulsante-preferita" class="btn-chiaro" aria-pressed="false">
            <i class="icona icona-star-vuota" aria-hidden="true"></i><span>Segui questa squadra</span>
          </button>
          <button type="button" id="pulsante-calendario" class="btn-contorno">
            <i class="icona icona-calendar-plus" aria-hidden="true"></i><span>Aggiungi al calendario</span>
          </button>
          <button type="button" id="pulsante-condividi" class="btn-contorno">
            <i class="icona icona-share" aria-hidden="true"></i><span>Condividi</span>
          </button>
        </div>

        <div id="statistiche-squadra" class="statistiche-squadra"></div>
      </section>

      <section class="sezione-dati-squadra">
        <h2 class="section-title">Prossime partite</h2>
        <div id="prossime-partite" class="elenco-partite-squadra">
          <div class="skeleton skeleton-card" style="height: 90px;"></div>
        </div>
      </section>

      <section class="sezione-dati-squadra">
        <h2 class="section-title">Risultati</h2>
        <p class="instruction instruction-fissa">Tocca una partita per vedere i marcatori</p>
        <div id="risultati-squadra" class="elenco-partite-squadra">
          <div class="skeleton skeleton-card" style="height: 90px;"></div>
        </div>
      </section>

      <section class="sezione-dati-squadra">
        <h2 class="section-title">Marcatori</h2>
        <div id="marcatori-squadra" class="marcatori-squadra">
          <div class="skeleton skeleton-card">
            <div class="skeleton skeleton-row"></div>
            <div class="skeleton skeleton-row"></div>
          </div>
        </div>
      </section>

      <section class="sezione-dati-squadra">
        <h2 class="section-title">Rosa</h2>
        <div id="rosa-squadra" class="rosa-squadra"></div>
      </section>
    </main>

    <my-footer></my-footer>
  </div>
  <script type="module" src="/js/headerFooterManager.js"></script>
