      height: 150px;

    .avviso-vuoto {
      padding: 20px;
      text-align: center;
    }

    .link-squadra {
      color: inherit;
      text-decoration: none;
    }

    .btn-riprova {
      margin-top: 10px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
